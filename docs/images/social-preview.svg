    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2aa5ff" stop-opacity="0.45"/><stop offset="1" stop-color="#2aa5ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="screen"><rect x="905" y="86" width="226" height="468" rx="30"/></clipPath>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
