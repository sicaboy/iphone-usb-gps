  <g font-family="-apple-system,'SF Pro Display','Helvetica Neue',Arial,sans-serif">
    <text x="80" y="150" font-size="26" font-weight="600" fill="#5cc8ff" letter-spacing="3">macOS  ·  USB  ·  iOS 17.4+</text>
    <text x="80" y="238" font-size="84" font-weight="800" fill="#ffffff">iPhone USB GPS</text>
    <text x="80" y="300" font-size="34" font-weight="500" fill="#c9d6e2">Set a fake iPhone location from your Mac.</text>
    <text x="80" y="346" font-size="34" font-weight="500" fill="#c9d6e2">No jailbreak. No sudo. No app on the phone.</text>
  </g>
  <g>
    <rect x="80" y="400" width="720" height="168" rx="16" fill="#060b14" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="108" cy="428" r="7" fill="#ff5f57"/><circle cx="132" cy="428" r="7" fill="#febc2e"/><circle cx="156" cy="428" r="7" fill="#28c840"/>
    <g font-family="'SF Mono',Menlo,Consolas,monospace" font-size="26">
      <text x="108" y="482" fill="#5cc8ff">$ <tspan fill="#ffffff">gps-set "Tokyo"</tspan></text>
      <text x="108" y="520" fill="#5cc8ff">$ <tspan fill="#ffffff">gps-set -- "-33.8688,151.2093"</tspan></text>
      <text x="108" y="558" fill="#5cc8ff">$ <tspan fill="#ffffff">gps-reset</tspan></text>
    </g>
  </g>
  <g>
